name: Set up Android build
description: Installs JDK 21, configures Gradle caching and installs the Android SDK platform used by compileSdk.
inputs:
  setup-gradle:
    description: Run gradle/actions/setup-gradle. Set to "false" when the job uses gradle/actions/dependency-submission, which sets up Gradle itself.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      if: inputs.setup-gradle == 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Install Android SDK platform 37
      shell: bash
      run: |
        sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        yes | "$sdkmanager" --licenses > /dev/null || true
        "$sdkmanager" --install "platforms;android-37.0" > /dev/null
