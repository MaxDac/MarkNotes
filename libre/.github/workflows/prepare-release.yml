name: Prepare release

# Opens a PR that sets the release version: the versionName/versionCode literals in app/build.gradle.kts (F-Droid
# reads them), the build entry in .fdroid.yml and the fastlane changelog F-Droid shows. Merge it, then run Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (semver X.Y.Z, tagged as vX.Y.Z)
        required: true
        type: string
      notes:
        description: What's new (plain text, at most 500 characters; F-Droid shows it as the changelog)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PRs opened with GITHUB_TOKEN don't trigger the required checks; RELEASE_PR_TOKEN (a fine-grained PAT with
          # contents and pull-requests write) avoids having to close and reopen the PR to start them.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semver."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch must be <= 99 to derive versionCode."
            exit 1
          fi
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          read -r _ current < <(scripts/app-version.sh)
          if (( code <= current )); then
            echo "::error::versionCode $code must be greater than the current $current."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          if (( ${#NOTES} > 500 )); then
            echo "::error::F-Droid changelogs are limited to 500 characters (got ${#NOTES})."
            exit 1
          fi

          # .fdroid.yml keeps only the latest build entry; fdroiddata keeps the history.
          if [ "$(grep -c '^  - versionName: ' .fdroid.yml)" != 1 ]; then
            echo "::error::.fdroid.yml must have exactly one Builds entry."
            exit 1
          fi
          sed -i -E \
            -e "s/^( *versionCode = )[0-9]+$/\1$code/" \
            -e "s/^( *versionName = )\"[^\"]*\"$/\1\"$VERSION\"/" \
            app/build.gradle.kts
          sed -i -E \
            -e "s/^(  - versionName: ).*/\1$VERSION/" \
            -e "s/^(    versionCode: ).*/\1$code/" \
            -e "s/^(    commit: ).*/\1v$VERSION/" \
            -e "s/^(CurrentVersion: ).*/\1$VERSION/" \
            -e "s/^(CurrentVersionCode: ).*/\1$code/" \
            .fdroid.yml
          printf '%s\n' "$NOTES" > "fastlane/metadata/android/en-US/changelogs/$code.txt"

          read -r name newcode < <(scripts/app-version.sh)
          [ "$name $newcode" = "$VERSION $code" ] || { echo "::error::Could not update app/build.gradle.kts."; exit 1; }
          git diff --stat
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add app/build.gradle.kts .fdroid.yml fastlane/metadata/android/en-US/changelogs
          git commit -m "Release $VERSION" --quiet
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Release $VERSION" --body-file - <<EOF
          ## Summary

          Sets the release version to $VERSION (versionCode $VERSION_CODE): the literals in \`app/build.gradle.kts\`,
          the build entry in \`.fdroid.yml\` and \`fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt\`.
          After merging, run the **Release** workflow on \`main\`; F-Droid picks up the \`v$VERSION\` tag.

          ## Parity impact

          None: version bump only.
          EOF
