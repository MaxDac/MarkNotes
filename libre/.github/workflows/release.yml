name: Release

# Publishes the version in app/build.gradle.kts (set by the "Prepare release" workflow) as a GitHub Release:
# marknotes-libre-X.Y.Z.apk, signed with the release key, plus SHA256SUMS. F-Droid rebuilds the same tag from source
# (.fdroid.yml) and ships this APK when its build matches, so the APK is built exactly the way F-Droid builds it and
# the release fails if F-Droid's check (apksigcopier compare) would fail.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version, changelog and tag
        id: version
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release from main (F-Droid builds the tagged main commit)."
            exit 1
          fi
          read -r version code < <(scripts/app-version.sh)
          echo "Releasing $version (versionCode $code)"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists; run the Prepare release workflow for a new version first."
            exit 1
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -s "$changelog" ]; then
            echo "::error file=$changelog::Missing changelog for versionCode $code."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-code=$code" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/checks.yml

  release:
    name: Build and publish release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      VERSION_CODE: ${{ needs.validate.outputs.version-code }}
      APK: marknotes-libre-${{ needs.validate.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build
      - uses: ./.github/actions/setup-sync-toolchain
      - name: Install apksigcopier
        run: pipx install apksigcopier==1.1.1
      - name: Build marknotes-sync from source
        run: scripts/build-sync-from-source.sh "$RUNNER_TEMP/marknotes-sync"
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "MARKNOTES_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        # No -Pmarknotes.dropboxAppKey: F-Droid builds with the committed key, and the APKs must match.
        env:
          MARKNOTES_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MARKNOTES_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MARKNOTES_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease --no-build-cache
          "-Pmarknotes.sync.fromSource=$RUNNER_TEMP/marknotes-sync"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          certs=$("$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$actual" ]; then
            echo "::error::Could not read the signer certificate SHA-256 digest."
            exit 1
          fi
          echo "CERT_SHA256=$actual" >> "$GITHUB_ENV"
          # F-Droid only publishes APKs signed with the key in .fdroid.yml (AllowedAPKSigningKeys).
          allowed=$(sed -n 's/^AllowedAPKSigningKeys: //p' .fdroid.yml)
          if [ "$actual" != "$allowed" ]; then
            echo "::error::Signer certificate SHA-256 $actual is not AllowedAPKSigningKeys ($allowed) in .fdroid.yml."
            exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::Repository variable RELEASE_CERT_SHA256 is not set; skipping signer pinning (actual: $actual)."
            exit 0
          fi
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signer certificate SHA-256 $actual does not match RELEASE_CERT_SHA256 $expected."
            exit 1
          fi
          echo "Signer certificate matches RELEASE_CERT_SHA256."
      - uses: actions/download-artifact@v8
        with:
          name: fdroid-unsigned-apk
          path: ${{ runner.temp }}/fdroid-build
      - name: Check F-Droid can verify the APK
        # What F-Droid does before publishing a reproducible build: copy our signature onto its own unsigned build.
        run: >-
          apksigcopier compare app/build/outputs/apk/release/app-release.apk
          --unsigned "$RUNNER_TEMP/fdroid-build/app-release-unsigned.apk"
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          # Same checksum file name as the desktop and web releases (verify with `sha256sum -c SHA256SUMS`).
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: marknotes-libre-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "MarkNotes $VERSION" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            --generate-notes \
            "${flags[@]}"
      - name: Write job summary
        if: always()
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "## MarkNotes $VERSION"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| Pre-release | $PRERELEASE |"
            echo "| Signer cert SHA-256 | \`${CERT_SHA256:-unknown}\` |"
            if [ -f dist/SHA256SUMS ]; then
              echo "| APK SHA-256 | \`$(grep " $APK\$" dist/SHA256SUMS | cut -d' ' -f1)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
