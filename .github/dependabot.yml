version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The libre/ submodule (MaxDac/marknotes-android, the shared code). Its own spec/ submodule is bumped there.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly