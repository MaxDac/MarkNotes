name: Checks

# Reusable checks shared by PR CI, Main CI and Release.
on:
  workflow_call:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    name: Lint (ktlint, detekt, Android Lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-android-build
      - name: Run ktlint, detekt and Android Lint
        run: ./gradlew ktlintCheck detekt lintDebug --continue
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            build/reports/detekt/
            **/build/reports/ktlint/
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-android-build
      - name: Run unit tests
        # :core is a plain JVM module, so its tests run under `test` rather than `testDebugUnitTest`.
        run: ./gradlew testDebugUnitTest :core:test --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  parity:
    name: Parity (marknotes-spec fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # libre/ (marknotes-android) and its libre/spec submodule (marknotes-spec).
          submodules: recursive
      - uses: ./.github/actions/setup-android-build
      - name: Run the marknotes-spec fixtures
        # Fails if the libre/spec submodule is missing, a fixture file is unmapped, or Android stops matching a case.
        run: >-
          ./gradlew :core:parityTest :app-shared:testDebugUnitTest --tests 'io.github.maxdac.marknotes.parity.*'
          -Pmarknotes.parity.required=true --continue
      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-reports
          path: |
            libre/core/build/reports/tests/parityTest/
            libre/core/build/test-results/parityTest/
            libre/app-shared/build/reports/tests/testDebugUnitTest/
            libre/app-shared/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Free disk space
        # The emulator needs several GB for its userdata partition; hosted runners ship with little free space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-build
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --continue :app:connectedDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup-android-build
      - name: Assemble debug
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
