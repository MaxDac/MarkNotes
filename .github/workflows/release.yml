name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (semver X.Y.Z, tagged as vX.Y.Z)
        required: true
        default: 0.1.0
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semver."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be <= 99 to derive versionCode."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version-code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/checks.yml

  release:
    name: Build and publish release
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      VERSION_CODE: ${{ needs.validate.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "MARKNOTES_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          MARKNOTES_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MARKNOTES_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MARKNOTES_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -Pmarknotes.versionName="$VERSION"
          -Pmarknotes.versionCode="$VERSION_CODE"
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/marknotes-$VERSION.apk"
          (cd dist && sha256sum "marknotes-$VERSION.apk" > "marknotes-$VERSION.apk.sha256")
          rm -f "$MARKNOTES_KEYSTORE_PATH"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "MarkNotes $VERSION" \
            --generate-notes \
            "${flags[@]}"
