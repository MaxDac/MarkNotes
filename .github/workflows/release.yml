name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (semver X.Y.Z, tagged as vX.Y.Z)
        required: true
        default: 0.1.0
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: true
        type: boolean
      allow-missing-providers:
        description: Allow releasing without DROPBOX_APP_KEY / MSAL_CLIENT_ID / MSAL_RELEASE_SIGNATURE_HASH (providers show as not configured)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semver."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be <= 99 to derive versionCode."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version-code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/checks.yml

  release:
    name: Build and publish release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      VERSION_CODE: ${{ needs.validate.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
      - name: Check cloud provider secrets
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          MSAL_CLIENT_ID: ${{ secrets.MSAL_CLIENT_ID }}
          MSAL_RELEASE_SIGNATURE_HASH: ${{ secrets.MSAL_RELEASE_SIGNATURE_HASH }}
          ALLOW_MISSING: ${{ inputs.allow-missing-providers }}
        run: |
          level=error
          if [ "$ALLOW_MISSING" = "true" ]; then level=warning; fi
          missing=0
          dropbox=configured
          onedrive=configured
          if [ -z "$DROPBOX_APP_KEY" ]; then
            echo "::$level::DROPBOX_APP_KEY secret is not set; Dropbox will show as not configured in the release APK."
            missing=1
            dropbox="not configured"
          fi
          for name in MSAL_CLIENT_ID MSAL_RELEASE_SIGNATURE_HASH; do
            if [ -z "${!name}" ]; then
              echo "::$level::$name secret is not set; OneDrive will show as not configured in the release APK."
              missing=1
              onedrive="not configured"
            fi
          done
          echo "DROPBOX_STATUS=$dropbox" >> "$GITHUB_ENV"
          echo "ONEDRIVE_STATUS=$onedrive" >> "$GITHUB_ENV"
          if [ "$missing" = 1 ] && [ "$level" = error ]; then
            echo "::error::Set the missing secrets (see README, Releasing) or re-run with allow-missing-providers."
            exit 1
          fi
      - uses: ./.github/actions/setup-android-build
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "MARKNOTES_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          MARKNOTES_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MARKNOTES_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MARKNOTES_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional; without them Dropbox/OneDrive show as not configured in the release APK.
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          MSAL_CLIENT_ID: ${{ secrets.MSAL_CLIENT_ID }}
          MSAL_SIGNATURE_HASH: ${{ secrets.MSAL_RELEASE_SIGNATURE_HASH }}
        run: >-
          ./gradlew :app:assembleRelease
          -Pmarknotes.versionName="$VERSION"
          -Pmarknotes.versionCode="$VERSION_CODE"
          -Pmarknotes.dropboxAppKey="$DROPBOX_APP_KEY"
          -Pmarknotes.msalClientId="$MSAL_CLIENT_ID"
          -Pmarknotes.msalSignatureHash="$MSAL_SIGNATURE_HASH"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          certs=$("$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$actual" ]; then
            echo "::error::Could not read the signer certificate SHA-256 digest."
            exit 1
          fi
          echo "CERT_SHA256=$actual" >> "$GITHUB_ENV"
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::warning::Repository variable RELEASE_CERT_SHA256 is not set; skipping signer pinning (actual: $actual)."
            exit 0
          fi
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signer certificate SHA-256 $actual does not match RELEASE_CERT_SHA256 $expected."
            exit 1
          fi
          echo "Signer certificate matches RELEASE_CERT_SHA256."
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/marknotes-$VERSION.apk"
          # Same checksum file name as the desktop and web releases (verify with `sha256sum -c SHA256SUMS`).
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: marknotes-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "MarkNotes $VERSION" \
            --generate-notes \
            "${flags[@]}"
      - name: Write job summary
        if: always()
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          {
            echo "## MarkNotes $VERSION"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| Pre-release | $PRERELEASE |"
            echo "| Signer cert SHA-256 | \`${CERT_SHA256:-unknown}\` |"
            echo "| Dropbox | ${DROPBOX_STATUS:-unknown} |"
            echo "| OneDrive | ${ONEDRIVE_STATUS:-unknown} |"
            if [ -f dist/SHA256SUMS ]; then
              echo "| APK SHA-256 | \`$(grep " marknotes-$VERSION.apk\$" dist/SHA256SUMS | cut -d' ' -f1)\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
