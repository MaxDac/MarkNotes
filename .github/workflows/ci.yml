name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and run unit tests
        run: ./gradlew assembleDebug test --stacktrace

  proton-sdk:
    name: Proton Drive SDK module (experimental)
    runs-on: ubuntu-latest
    # The SDK is experimental; failures here must not block the main build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble with the Proton Drive SDK
        run: ./gradlew :app:assembleDebug -Pmarknotes.protonSdk=true --stacktrace
