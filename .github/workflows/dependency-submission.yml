name: Dependency submission

# Submits the resolved Gradle dependency graph (including transitive dependencies) for main, so Dependabot
# alerts and PR dependency review see every Gradle dependency. This is the Gradle counterpart of the
# `npm audit` / `mix deps` audits in the desktop and web repos.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  submit:
    name: Gradle dependency submission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android-build
        with:
          setup-gradle: "false"
      - uses: gradle/actions/dependency-submission@v6
